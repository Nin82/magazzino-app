<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Magazzino Backendless</title>

<!-- ================= PWA SETTINGS ================= -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Icone Lucide -->
<script type="module">
    import { createIcons } from 'https://cdn.jsdelivr.net/npm/lucide@latest/dist/esm/lucide.js'; 
    window.addEventListener('load', () => createIcons());
</script>

<!-- Backendless SDK -->
<script src="https://unpkg.com/backendless/dist/backendless.min.js"></script>

<!-- Libreria QR Code -->
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.9/html5-qrcode.min.js"></script>

<!-- Libreria Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<style>
body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin:0; padding:24px; background:#f8fafc; color:#1f2937; }
.hidden { display:none; }
.card { box-shadow:0 4px 6px rgba(0,0,0,0.05),0 1px 3px rgba(0,0,0,0.05); }
.tab-active { border-bottom:3px solid #4f46e5; color:#4f46e5; font-weight:600; }
.input-focus:focus { border-color:#4f46e5; box-shadow:0 0 0 1px #4f46e5; }
.btn-primary { transition: all 0.2s; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(79,70,229,0.2); }

/* Notification */
#notification-box { position:fixed; top:20px; right:20px; z-index:1000; width:300px; }
.notification { margin-bottom:10px; padding:12px; border-radius:8px; box-shadow:0 4px 6px rgba(0,0,0,0.1); transition:opacity 0.5s ease-in-out; }
.success { background-color:#ecfdf5; border:1px solid #10b981; color:#065f46; }
.error { background-color:#fef2f2; border:1px solid #ef4444; color:#991b1b; }
.info { background-color:#eff6ff; border:1px solid #3b82f6; color:#1e40af; }

/* QR Reader */
#qr-reader { width:100%; max-width:400px; margin:0 auto; border:2px solid #ccc; border-radius:8px; overflow:hidden; }

/* Modal */
.modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:2000; }
.modal-content { background:white; padding:24px; border-radius:12px; max-width:450px; width:90%; max-height:90vh; overflow-y:auto; }
</style>
</head>

<body class="min-h-screen flex flex-col">

<header class="bg-white shadow-md p-4 flex justify-between items-center z-10">
    <h1 class="text-2xl font-bold text-indigo-600">Gestione Magazzino</h1>
    <div id="auth-status" class="flex items-center space-x-4 hidden">
        <span id="user-display" class="text-sm font-medium text-gray-700"></span>
        <button id="logout-btn" onclick="logout()" class="px-3 py-1 bg-red-500 text-white text-sm font-semibold rounded-lg hover:bg-red-600">
            <i data-lucide="log-out" class="h-4 w-4 inline-block mr-1"></i> Logout
        </button>
    </div>
</header>

<main id="view-container" class="flex-grow p-4 md:p-8">

    <!-- Login/Register -->
    <div id="login-view" class="view-content hidden">
        <div class="max-w-md mx-auto bg-white p-6 rounded-xl card space-y-6">
            <div class="flex space-x-4 border-b border-gray-200">
                <button id="auth-tab-login" class="flex-1 py-2 tab-active" onclick="switchAuthTab('login')">Login</button>
                <button id="auth-tab-register" class="flex-1 py-2" onclick="switchAuthTab('register')">Registrazione</button>
            </div>
            <div id="auth-content-login" class="space-y-4">
                <input id="login-email" type="email" placeholder="Email" class="w-full p-2 border rounded input-focus">
                <input id="login-password" type="password" placeholder="Password" class="w-full p-2 border rounded input-focus">
                <button onclick="login()" class="w-full p-2 bg-indigo-600 text-white rounded btn-primary">Login</button>
                <button onclick="handlePasswordResetRequest()" class="w-full p-2 bg-gray-200 rounded">Recupero Password</button>
            </div>
            <div id="auth-content-register" class="hidden space-y-4">
                <input id="register-email" type="email" placeholder="Email" class="w-full p-2 border rounded input-focus">
                <input id="register-password" type="password" placeholder="Password" class="w-full p-2 border rounded input-focus">
                <input id="register-password-confirm" type="password" placeholder="Conferma Password" class="w-full p-2 border rounded input-focus">
                <button onclick="registerUser()" class="w-full p-2 bg-indigo-600 text-white rounded btn-primary">Registrati</button>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-view" class="view-content hidden space-y-8">
        <div class="max-w-6xl mx-auto">

            <!-- STATISTICHE -->
            <div id="dashboard-stats-tab" class="bg-white p-6 rounded-xl card mb-8">
                <h3 class="text-xl font-bold mb-4 flex items-center"><i data-lucide="pie-chart" class="h-5 w-5 mr-2 text-indigo-600"></i>Statistiche di Magazzino</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-indigo-50 p-4 rounded-lg flex items-center justify-between">
                        <div><p class="text-sm text-indigo-700 font-medium">Articoli Unici</p><p id="stat-total-items" class="text-3xl font-bold text-indigo-800">0</p></div>
                        <i data-lucide="boxes" class="h-8 w-8 text-indigo-400"></i>
                    </div>
                    <div class="bg-green-50 p-4 rounded-lg flex items-center justify-between">
                        <div><p class="text-sm text-green-700 font-medium">Unità Totali</p><p id="stat-total-qty" class="text-3xl font-bold text-green-800">0</p></div>
                        <i data-lucide="package" class="h-8 w-8 text-green-400"></i>
                    </div>
                    <div class="bg-yellow-50 p-4 rounded-lg flex items-center justify-between">
                        <div><p class="text-sm text-yellow-700 font-medium">Articoli Sotto Soglia (<=5)</p><p id="stat-low-stock" class="text-3xl font-bold text-yellow-800">0</p></div>
                        <i data-lucide="alert-triangle" class="h-8 w-8 text-yellow-400"></i>
                    </div>
                </div>
                <div id="chart-container" class="h-96">
                    <canvas id="inventory-chart"></canvas>
                </div>
            </div>

            <!-- SCANNER QR -->
            <div class="p-6 bg-white rounded-xl card mb-8">
                <h3 class="text-xl font-bold mb-4 flex items-center"><i data-lucide="qrcode" class="h-5 w-5 mr-2 text-indigo-600"></i>Scanner QR/Barcode</h3>
                <div id="qr-reader" class="mb-4"></div>
                <input type="text" id="qr-result" placeholder="Risultato Scansione" class="w-full p-2 border rounded bg-gray-100 text-sm" readonly>
            </div>

            <!-- CARICO / SCARICO -->
            <div class="flex border-b border-gray-200 mb-6">
                <button id="tab-carico" onclick="switchMode('carico')" class="flex-1 px-4 py-2 text-gray-700 transition-colors tab-active">
                    <i data-lucide="package-plus" class="h-5 w-5 inline-block mr-1"></i>Carico
                </button>
                <button id="tab-scarico" onclick="switchMode('scarico')" class="flex-1 px-4 py-2 text-gray-700 transition-colors">
                    <i data-lucide="package-minus" class="h-5 w-5 inline-block mr-1"></i>Scarico
                </button>
            </div>

            <!-- FORM CARICO -->
            <div id="form-carico" class="bg-white p-6 rounded-xl card space-y-4">
                <input type="text" id="carico-barcode" placeholder="Barcode" class="w-full p-2 border rounded input-focus">
                <input type="text" id="carico-article" placeholder="Nome Articolo" class="w-full p-2 border rounded input-focus">
                <input type="number" id="carico-qty" value="1" min="1" class="w-full p-2 border rounded input-focus">
                <div id="giacenza-display" class="text-sm text-gray-600">Giacenza Attuale: -</div>
                <button onclick="doCarico()" class="w-full p-2 bg-green-600 text-white rounded btn-primary">Carica Articolo</button>
            </div>

            <!-- FORM SCARICO -->
            <div id="form-scarico" class="bg-white p-6 rounded-xl card space-y-4 hidden">
                <input type="text" id="scarico-barcode" placeholder="Barcode" class="w-full p-2 border rounded input-focus">
                <select id="scarico-select" class="w-full p-2 border rounded input-focus"></select>
                <input type="number" id="scarico-qty" value="1" min="1" class="w-full p-2 border rounded input-focus">
                <div id="scarico-giacenza-display" class="text-sm text-gray-600">Giacenza Attuale: -</div>
                <button onclick="doScarico()" class="w-full p-2 bg-red-600 text-white rounded btn-primary">Scarica Articolo</button>
            </div>

            <!-- LISTA MAGAZZINO -->
            <div class="mt-8 bg-white p-6 rounded-xl card">
                <h3 class="text-xl font-bold mb-4 flex items-center"><i data-lucide="list-checks" class="h-5 w-5 mr-2 text-indigo-600"></i>Stock Corrente</h3>
                <div id="magazzino-list" class="space-y-3"></div>
                <button onclick="loadDashboardData()" class="mt-4 w-full p-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200">
                    <i data-lucide="refresh-cw" class="h-4 w-4 inline-block mr-1"></i> Aggiorna Lista
                </button>
            </div>

        </div>
    </div>

</main>

<!-- Modal Edit -->
<div id="edit-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3 class="font-bold text-lg mb-4">Modifica Articolo</h3>
        <input type="hidden" id="edit-objectId">
        <input type="text" id="edit-article" placeholder="Articolo" class="w-full p-2 border rounded mb-2">
        <input type="text" id="edit-barcode" placeholder="Barcode" class="w-full p-2 border rounded mb-2">
        <input type="number" id="edit-quantity" placeholder="Quantità" class="w-full p-2 border rounded mb-4">
        <div class="flex justify-between">
            <button onclick="saveEdit()" class="p-2 bg-indigo-600 text-white rounded">Salva</button>
            <button onclick="deleteItem()" class="p-2 bg-red-600 text-white rounded">Elimina</button>
            <button onclick="closeModal('edit-modal')" class="p-2 bg-gray-300 rounded">Chiudi</button>
        </div>
    </div>
</div>

<!-- Loader -->
<div id="loading-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white p-6 rounded-lg flex items-center">
        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Caricamento...</span>
    </div>
</div>

<!-- Notifications -->
<div id="notification-box"></div>

<!-- ==================== SCRIPT ==================== -->
<script>
/* =========== CONFIG BACKENDLESS ============ */
const APPLICATION_ID = 'AA895053-C960-45EC-BFBE-FCBAFD9D7D0B'; 
const JAVASCRIPT_API_KEY = '1F4341D8-CAB8-44F6-97D6-203322D8D245';
const MAGAZZINO_TABLE_NAME = 'Magazzino';

let currentUser = null;
let html5QrcodeScanner = null;
let lastScanned = '';
let isCaricoMode = true;
let currentAuthTab = 'login';
let chartInstance = null;
let magazzinoData = [];

/* ============ UTILITY ============ */
function showNotification(message,type='info',duration=3000){
    const container = document.getElementById('notification-box');
    if(!container) return;
    const notification = document.createElement('div');
    notification.className=`notification ${type}`;
    notification.innerHTML=`<strong>${type.toUpperCase()}:</strong> ${message}`;
    container.appendChild(notification);
    setTimeout(()=>{notification.style.opacity='0';notification.addEventListener('transitionend',()=>notification.remove());},duration);
}

function toggleLoading(show){document.getElementById('loading-overlay')?.classList.toggle('hidden',!show);}
function showView(viewId){document.querySelectorAll('.view-content').forEach(v=>v.classList.add('hidden'));document.getElementById(viewId)?.classList.remove('hidden');}
function showModal(modalId){document.getElementById(modalId)?.classList.remove('hidden');}
function closeModal(modalId){document.getElementById(modalId)?.classList.add('hidden');}

/* ============ BACKENDLESS INIT ============ */
function initBackendless(){
    Backendless.initApp(APPLICATION_ID,JAVASCRIPT_API_KEY);
    return true;
}

/* ============ AUTH ============ */
function switchAuthTab(tab){
    currentAuthTab=tab;
    document.getElementById('auth-tab-login').classList.toggle('tab-active',tab==='login');
    document.getElementById('auth-tab-register').classList.toggle('tab-active',tab==='register');
    document.getElementById('auth-content-login').classList.toggle('hidden',tab!=='login');
    document.getElementById('auth-content-register').classList.toggle('hidden',tab!=='register');
}

async function login(){
    const email=document.getElementById('login-email').value;
    const password=document.getElementById('login-password').value;
    toggleLoading(true);
    try{
        currentUser=await Backendless.UserService.login(email,password,true);
        updateAuthUI(currentUser);
        showView('dashboard-view');
        initializeQrScanner();
        await loadDashboardData();
        showNotification('Login effettuato con successo.','success');
    }catch(e){showNotification('Errore login: '+(e.message||'Email/Password errati'),'error');}finally{toggleLoading(false);}
}

async function registerUser(){
    const email=document.getElementById('register-email').value;
    const password=document.getElementById('register-password').value;
    const passwordConfirm=document.getElementById('register-password-confirm').value;
    if(!email||!password||!passwordConfirm){showNotification('Compila tutti i campi','error');return;}
    if(password!==passwordConfirm){showNotification('Password non corrispondono','error');return;}
    toggleLoading(true);
    try{
        const user=new Backendless.User();
        user.email=email; user.password=password;
        await Backendless.UserService.register(user);
        showNotification('Registrazione avvenuta, effettua il login','success');
        switchAuthTab('login');
    }catch(e){showNotification('Errore registrazione: '+(e.message||''),'error');}
    finally{toggleLoading(false);}
}

async function logout(){
    toggleLoading(true);
    try{await Backendless.UserService.logout();currentUser=null;showView('login-view');showNotification('Logout effettuato','info');}
    catch(e){showNotification('Errore logout','error');}
    finally{toggleLoading(false);}
}

function updateAuthUI(user){
    if(user){
        document.getElementById('auth-status').classList.remove('hidden');
        document.getElementById('user-display').innerText=user.email;
    } else {
        document.getElementById('auth-status').classList.add('hidden');
    }
}

/* ============ QR SCANNER ============ */
function initializeQrScanner(){
    if(html5QrcodeScanner)return;
    html5QrcodeScanner=new Html5Qrcode("qr-reader");
    html5QrcodeScanner.start({ facingMode: "environment" },{
        fps:10, qrbox:250
    },
    qrCodeMessage=>{
        lastScanned=qrCodeMessage;
        document.getElementById('qr-result').value=lastScanned;
        document.getElementById('carico-barcode').value=lastScanned;
        document.getElementById('scarico-barcode').value=lastScanned;
    },
    errorMessage=>{});
}

/* ============ CARICO / SCARICO ============ */
function switchMode(mode){
    isCaricoMode=(mode==='carico');
    document.getElementById('tab-carico').classList.toggle('tab-active',isCaricoMode);
    document.getElementById('tab-scarico').classList.toggle('tab-active',!isCaricoMode);
    document.getElementById('form-carico').classList.toggle('hidden',!isCaricoMode);
    document.getElementById('form-scarico').classList.toggle('hidden',isCaricoMode);
}

async function doCarico(){
    const barcode=document.getElementById('carico-barcode').value;
    const name=document.getElementById('carico-article').value;
    const qty=parseInt(document.getElementById('carico-qty').value)||1;
    if(!barcode||!name){showNotification('Compila tutti i campi','error');return;}
    toggleLoading(true);
    try{
        await Backendless.Data.of(MAGAZZINO_TABLE_NAME).save({barcode,name,qty});
        showNotification('Articolo caricato','success');
        await loadDashboardData();
    }catch(e){showNotification('Errore carico: '+(e.message||''),'error');}
    finally{toggleLoading(false);}
}

async function doScarico(){
    const barcode=document.getElementById('scarico-barcode').value;
    const qty=parseInt(document.getElementById('scarico-qty').value)||1;
    if(!barcode){showNotification('Compila il barcode','error');return;}
    toggleLoading(true);
    try{
        const items=await Backendless.Data.of(MAGAZZINO_TABLE_NAME).find({whereClause:`barcode='${barcode}'`});
        if(items.length===0){showNotification('Articolo non trovato','error');return;}
        const item=items[0];
        item.qty=Math.max(0,item.qty-qty);
        await Backendless.Data.of(MAGAZZINO_TABLE_NAME).save(item);
        showNotification('Articolo scaricato','success');
        await loadDashboardData();
    }catch(e){showNotification('Errore scarico','error');}
    finally{toggleLoading(false);}
}

/* ============ DASHBOARD / LISTA ============ */
async function loadDashboardData(){
    toggleLoading(true);
    try{
        const data=await Backendless.Data.of(MAGAZZINO_TABLE_NAME).find();
        magazzinoData=data;
        updateStats(data);
        renderList(data);
        renderChart(data);
        populateScaricoSelect(data);
    }catch(e){showNotification('Errore caricamento dashboard','error');}
    finally{toggleLoading(false);}
}

function updateStats(data){
    const totalItems=data.length;
    const totalQty=data.reduce((acc,i)=>acc+i.qty,0);
    const lowStock=data.filter(i=>i.qty<=5).length;
    document.getElementById('stat-total-items').innerText=totalItems;
    document.getElementById('stat-total-qty').innerText=totalQty;
    document.getElementById('stat-low-stock').innerText=lowStock;
}

function renderList(data){
    const container=document.getElementById('magazzino-list');
    container.innerHTML='';
    data.forEach(i=>{
        const div=document.createElement('div');
        div.className='p-2 border rounded flex justify-between items-center';
        div.innerHTML=`<div><strong>${i.name}</strong> (Barcode: ${i.barcode}) - Qty: ${i.qty}</div>
        <button onclick="editItem('${i.objectId}')" class="p-1 bg-indigo-600 text-white rounded text-sm">Modifica</button>`;
        container.appendChild(div);
    });
}

function renderChart(data){
    const ctx=document.getElementById('inventory-chart').getContext('2d');
    const labels=data.map(i=>i.name);
    const values=data.map(i=>i.qty);
    if(chartInstance) chartInstance.destroy();
    chartInstance=new Chart(ctx,{type:'bar',data:{labels, datasets:[{label:'Quantità', data:values, backgroundColor:'rgba(79,70,229,0.6)'}]}, options:{responsive:true,plugins:{legend:{display:false}}}});
}

function populateScaricoSelect(data){
    const select=document.getElementById('scarico-select');
    select.innerHTML='';
    data.forEach(i=>{const opt=document.createElement('option');opt.value=i.objectId;opt.text=`${i.name} - Qty: ${i.qty}`;select.appendChild(opt);});
}

/* ============ MODALE EDIT ============ */
async function editItem(objectId){
    const item=magazzinoData.find(i=>i.objectId===objectId);
    if(!item)return;
    document.getElementById('edit-objectId').value=objectId;
    document.getElementById('edit-article').value=item.name;
    document.getElementById('edit-barcode').value=item.barcode;
    document.getElementById('edit-quantity').value=item.qty;
    showModal('edit-modal');
}

async function saveEdit(){
    const objectId=document.getElementById('edit-objectId').value;
    const name=document.getElementById('edit-article').value;
    const barcode=document.getElementById('edit-barcode').value;
    const qty=parseInt(document.getElementById('edit-quantity').value)||0;
    toggleLoading(true);
    try{
        await Backendless.Data.of(MAGAZZINO_TABLE_NAME).save({objectId,name,barcode,qty});
        showNotification('Articolo aggiornato','success');
        await loadDashboardData();
        closeModal('edit-modal');
    }catch(e){showNotification('Errore aggiornamento','error');}
    finally{toggleLoading(false);}
}

async function deleteItem(){
    const objectId=document.getElementById('edit-objectId').value;
    toggleLoading(true);
    try{
        await Backendless.Data.of(MAGAZZINO_TABLE_NAME).remove({objectId});
        showNotification('Articolo eliminato','success');
        await loadDashboardData();
        closeModal('edit-modal');
    }catch(e){showNotification('Errore eliminazione','error');}
    finally{toggleLoading(false);}
}

/* ============ ONLOAD ============ */
window.onload=function(){
    initBackendless();
    showView('login-view');
};
</script>

</body>
</html>
