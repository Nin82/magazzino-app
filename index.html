<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Magazzino Appwrite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icone Lucide -->
    <script type="module">
        import { createIcons } from 'https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js';
        window.addEventListener('load', () => createIcons());
    </script>
    <!-- Manifest per PWA -->
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fc; }
        .card { box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.05); }
        .btn-primary { transition: all 0.2s; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2); }
        .dashboard-grid { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- SDK Appwrite -->
    <script src="https://unpkg.com/appwrite@13.0.0"></script>

    <div id="app" class="flex-grow flex flex-col">
        <!-- Loader e Messaggi -->
        <div id="loading-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 hidden">
            <div class="bg-white p-6 rounded-lg flex items-center">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span id="loading-message">Caricamento...</span>
            </div>
        </div>

        <!-- Modale per Messaggi/Errori -->
        <div id="modal-container" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-40 hidden">
            <div id="modal-content" class="bg-white p-6 rounded-lg card max-w-sm mx-4" role="alert">
                <h3 id="modal-title" class="font-bold text-lg mb-2 text-gray-800">Messaggio</h3>
                <p id="modal-body" class="text-sm text-gray-600"></p>
                <div class="mt-4 text-right">
                    <button onclick="hideModal()" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700">Chiudi</button>
                </div>
            </div>
        </div>

        <!-- Header -->
        <header class="bg-white shadow-md p-4 flex justify-between items-center z-10">
            <h1 class="text-2xl font-bold text-indigo-600">App Magazzino</h1>
            <div id="auth-status" class="flex items-center space-x-4">
                <span id="user-display" class="text-sm font-medium text-gray-700 hidden"></span>
                <button id="logout-btn" onclick="logout()" class="px-3 py-1 bg-red-500 text-white text-sm font-semibold rounded-lg hover:bg-red-600 hidden">
                    <i data-lucide="log-out" class="h-4 w-4 inline-block mr-1"></i>
                    Logout
                </button>
            </div>
        </header>

        <!-- Contenuto principale gestito dalla vista -->
        <main class="flex-grow p-4 md:p-8">
            <div id="view-container">
                <!-- Contenuto dinamico (Login, Dashboard, Gestione Tenant) -->
            </div>
        </main>
    </div>

    <script>
        // =========================================================================
        // CONFIGURAZIONE APPWRITE (I TUOI VALORI SONO STATI INSERITI QUI)
        // =========================================================================
        const APPWRITE_ENDPOINT = 'https://cloud.appwrite.io/v1'; 
        const APPWRITE_PROJECT_ID = '69013029003722a483bd';     

        // Nomi esatti delle collezioni create nel pannello di Appwrite
        const COLLECTION_IDS = {
            PROFILES: 'profiles',
            TENANTS: 'tenants',
            ITEMS: 'items',
            INVENTORY: 'inventory',
        };
        const DATABASE_ID = 'default'; // Di solito 'default' o l'ID che hai usato

        // =========================================================================
        // INIZIALIZZAZIONE GLOBALE APPWRITE
        // =========================================================================
        const { Client, Account, Databases, Query } = Appwrite;
        const client = new Client()
            .setEndpoint(APPWRITE_ENDPOINT)
            .setProject(APPWRITE_PROJECT_ID);

        const account = new Account(client);
        const databases = new Databases(client);

        let currentUser = null;
        let currentTenantId = null;
        let currentTenantName = '';
        let tenantsCache = [];

        // =========================================================================
        // UTILITY E UI MANAGEMENT
        // =========================================================================

        function showLoading(message = 'Caricamento...') {
            document.getElementById('loading-message').textContent = message;
            document.getElementById('loading-overlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        function showModal(title, body) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = body;
            document.getElementById('modal-container').classList.remove('hidden');
        }

        function hideModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        function updateAuthUI(user) {
            const userDisplay = document.getElementById('user-display');
            const logoutBtn = document.getElementById('logout-btn');

            if (user) {
                currentUser = user;
                userDisplay.textContent = `Benvenuto, ${user.displayName || user.email}`;
                userDisplay.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
            } else {
                currentUser = null;
                userDisplay.classList.add('hidden');
                logoutBtn.classList.add('hidden');
            }
        }

        // =========================================================================
        // GESTIONE AUTENTICAZIONE
        // =========================================================================

        async function checkAuth() {
            showLoading('Verifica sessione...');
            try {
                const session = await account.get();
                currentUser = session;
                await fetchUserProfile(session.$id);
            } catch (error) {
                console.error("Nessuna sessione attiva:", error);
                currentUser = null;
                renderLoginView();
            } finally {
                hideLoading();
            }
        }

        async function fetchUserProfile(userId) {
            try {
                // Tenta di ottenere il profilo esistente
                const response = await databases.listDocuments(
                    DATABASE_ID,
                    COLLECTION_IDS.PROFILES,
                    [Query.equal('$id', userId)]
                );
                
                if (response.documents.length > 0) {
                    // Profilo trovato
                    currentUser.displayName = response.documents[0].display_name;
                    await fetchTenants();
                } else {
                    // Profilo non trovato: deve essere creato
                    currentUser.displayName = currentUser.name || currentUser.email.split('@')[0]; // Default name
                    await createProfileDocument(currentUser.$id, currentUser.displayName);
                    await fetchTenants();
                }

            } catch (error) {
                console.error("Errore nel recupero/creazione profilo:", error);
                showModal('Errore Database', `Impossibile accedere al tuo profilo utente. Assicurati che le collezioni siano state create correttamente. Errore: ${error.message}`);
                // Forza il logout per evitare loop
                await logout(false);
            }
        }

        async function createProfileDocument(userId, displayName) {
            showLoading('Creazione profilo...');
            try {
                const document = await databases.createDocument(
                    DATABASE_ID,
                    COLLECTION_IDS.PROFILES,
                    userId, // Usa l'ID utente come ID del documento per un mapping 1:1
                    { display_name: displayName }
                );
                currentUser.displayName = document.display_name;
            } catch (error) {
                console.error("Errore nella creazione del documento profilo:", error);
                // Non mostriamo modale, l'errore è gestito in fetchUserProfile
            }
        }


        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            showLoading('Accesso in corso...');
            try {
                await account.createEmailPasswordSession(email, password);
                await checkAuth(); // Ricarica auth e fetch profile/tenants
            } catch (error) {
                showModal('Errore di Accesso', `Verifica email e password. Errore: ${error.message}`);
            } finally {
                hideLoading();
            }
        }

        async function register() {
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const displayName = document.getElementById('register-name').value;
            
            showLoading('Registrazione in corso...');
            try {
                await account.create(
                    'unique()', // Appwrite ID
                    email,
                    password,
                    displayName
                );
                showModal('Registrazione Riuscita', `Utente ${email} creato con successo. Ora puoi effettuare il login.`);
            } catch (error) {
                showModal('Errore di Registrazione', `Impossibile completare la registrazione. Errore: ${error.message}`);
            } finally {
                hideLoading();
            }
        }

        async function logout(renderView = true) {
            showLoading('Uscita...');
            try {
                await account.deleteSession('current');
                currentUser = null;
                currentTenantId = null;
                currentTenantName = '';
                tenantsCache = [];
            } catch (error) {
                console.error("Errore durante il logout:", error);
            } finally {
                updateAuthUI(null);
                if (renderView) {
                    renderLoginView();
                }
                hideLoading();
            }
        }
        
        // Nuova funzione per richiedere il recupero della password
        async function requestPasswordRecovery() {
            const email = document.getElementById('recovery-email').value.trim();
            if (!email) {
                showModal('Attenzione', 'Inserisci l\'indirizzo email per il recupero.');
                return;
            }

            // !!! IMPORTANTE: Sostituisci questo URL con l'URL della tua pagina di reset password !!!
            const recoveryUrl = window.location.origin + window.location.pathname; // URL di base per reindirizzare a questa pagina dopo il click sull'email
            // Se gestisci il reset su una pagina dedicata, usa: 'https://tuoapp.com/reset-password'

            showLoading('Invio email di recupero...');
            try {
                await account.createRecovery(
                    email,
                    recoveryUrl
                );

                showModal('Email Inviata', `Se l'indirizzo email è corretto, riceverai un link per il reset della password. Controlla la tua casella di posta.`);
                renderLoginView(); // Torna al login dopo l'invio
            } catch (error) {
                // Appwrite non distingue tra utente trovato e non trovato per sicurezza
                showModal('Richiesta Fallita', `Si è verificato un errore. Riprova più tardi o verifica l'email. Errore: ${error.message}`);
            } finally {
                hideLoading();
            }
        }
        
        // Nuova funzione per gestire la seconda fase del reset (NON IMPLEMENTATA in questo file)
        async function handlePasswordRecovery() {
            const params = new URLSearchParams(window.location.search);
            const userId = params.get('userId');
            const secret = params.get('secret');

            if (userId && secret) {
                // Qui dovresti renderizzare un'interfaccia per inserire la NUOVA password
                // e chiamare account.updateRecovery(userId, secret, newPassword, newPassword)
                // Questo è un placeholder:
                showModal('Reset Password', 'Sei stato reindirizzato dal link di recupero. Qui andrebbe l\'interfaccia per inserire la nuova password e l\'implementazione di account.updateRecovery().');
                // Dopo il reset, renderLoginView()
            }
        }

        // =========================================================================
        // GESTIONE DEI TENANTS (MAGAZZINI)
        // =========================================================================

        async function fetchTenants() {
            showLoading('Caricamento magazzini...');
            try {
                const response = await databases.listDocuments(
                    DATABASE_ID,
                    COLLECTION_IDS.TENANTS,
                    [Query.equal('owner_id', currentUser.$id)]
                );
                
                tenantsCache = response.documents;

                if (tenantsCache.length === 0) {
                    renderTenantManagementView();
                } else if (!currentTenantId) {
                    // Seleziona il primo tenant come predefinito se non ne è stato selezionato uno
                    currentTenantId = tenantsCache[0].$id;
                    currentTenantName = tenantsCache[0].name;
                    renderDashboard();
                } else {
                    // Mantiene la selezione corrente
                    const current = tenantsCache.find(t => t.$id === currentTenantId);
                    if (current) {
                         currentTenantName = current.name;
                    } else {
                        // Se il tenant corrente è stato cancellato, riparte dalla lista
                         currentTenantId = tenantsCache[0]?.$id || null;
                         currentTenantName = tenantsCache[0]?.name || '';
                         renderDashboard();
                    }
                }
                
                updateAuthUI(currentUser); // Aggiorna UI con display name
            } catch (error) {
                console.error("Errore nel recupero tenants:", error);
                showModal('Errore Database', `Impossibile caricare i magazzini. Errore: ${error.message}`);
                renderDashboard(); // Tenta di renderizzare anche con errore
            } finally {
                hideLoading();
            }
        }

        async function createTenant() {
            const name = prompt("Inserisci il nome del nuovo magazzino:");
            if (!name || name.trim() === "") return;

            showLoading('Creazione magazzino...');
            try {
                await databases.createDocument(
                    DATABASE_ID,
                    COLLECTION_IDS.TENANTS,
                    'unique()',
                    { 
                        name: name.trim(), 
                        owner_id: currentUser.$id 
                    }
                );
                showModal('Successo', `Magazzino "${name}" creato!`);
                await fetchTenants(); // Ricarica la lista
            } catch (error) {
                showModal('Errore', `Impossibile creare il magazzino. Errore: ${error.message}`);
            } finally {
                hideLoading();
            }
        }

        function switchTenant(tenantId) {
            currentTenantId = tenantId;
            const tenant = tenantsCache.find(t => t.$id === tenantId);
            currentTenantName = tenant ? tenant.name : '';
            renderDashboard();
        }

        // =========================================================================
        // GESTIONE PRODOTTI E INVENTARIO (CRUD)
        // =========================================================================
        let itemsCache = [];
        let inventoryCache = {}; // Mappa {itemId: stock}

        async function loadInventoryData() {
            if (!currentTenantId) return;

            showLoading(`Caricamento inventario di ${currentTenantName}...`);
            try {
                // 1. Carica gli Items per il tenant
                const itemsResponse = await databases.listDocuments(
                    DATABASE_ID,
                    COLLECTION_IDS.ITEMS,
                    [Query.equal('tenant_id', currentTenantId)]
                );
                itemsCache = itemsResponse.documents;

                // 2. Carica l'Inventory (Stock) per il tenant
                const inventoryResponse = await databases.listDocuments(
                    DATABASE_ID,
                    COLLECTION_IDS.INVENTORY,
                    [Query.equal('tenant_id', currentTenantId)]
                );
                
                // Mappa l'inventario per accesso rapido
                inventoryCache = {};
                inventoryResponse.documents.forEach(doc => {
                    inventoryCache[doc.item_id] = { 
                        stock: doc.stock,
                        docId: doc.$id
                    };
                });
                
            } catch (error) {
                console.error("Errore nel caricamento dati inventario:", error);
                showModal('Errore Database', `Impossibile caricare i dati di ${currentTenantName}. Errore: ${error.message}`);
            } finally {
                renderInventoryList();
                hideLoading();
            }
        }

        async function createItem() {
            const name = document.getElementById('new-item-name').value.trim();
            const sku = document.getElementById('new-item-sku').value.trim();
            const description = document.getElementById('new-item-description').value.trim();
            const initialStock = parseInt(document.getElementById('new-item-stock').value, 10) || 0;

            if (!name || !sku) {
                showModal('Attenzione', 'Nome e SKU sono obbligatori.');
                return;
            }

            showLoading('Aggiunta prodotto...');
            try {
                // 1. Crea l'Item
                const itemDoc = await databases.createDocument(
                    DATABASE_ID,
                    COLLECTION_IDS.ITEMS,
                    'unique()',
                    { 
                        name, 
                        sku, 
                        description, 
                        tenant_id: currentTenantId 
                    }
                );

                // 2. Crea il record di Inventory (Stock)
                await databases.createDocument(
                    DATABASE_ID,
                    COLLECTION_IDS.INVENTORY,
                    'unique()',
                    {
                        item_id: itemDoc.$id,
                        tenant_id: currentTenantId,
                        stock: initialStock
                    }
                );

                // Pulisce i campi e ricarica i dati
                document.getElementById('new-item-name').value = '';
                document.getElementById('new-item-sku').value = '';
                document.getElementById('new-item-description').value = '';
                document.getElementById('new-item-stock').value = 0;
                
                showModal('Successo', `Prodotto "${name}" aggiunto con stock iniziale ${initialStock}.`);
                loadInventoryData();
            } catch (error) {
                showModal('Errore', `Impossibile aggiungere il prodotto. Errore: ${error.message}`);
            } finally {
                hideLoading();
            }
        }

        async function updateStock(itemId, delta) {
            const currentStock = inventoryCache[itemId]?.stock || 0;
            const inventoryDocId = inventoryCache[itemId]?.docId;
            const newStock = Math.max(0, currentStock + delta); // Lo stock non può essere negativo
            
            if (!inventoryDocId) {
                showModal('Errore', 'Record di inventario non trovato.');
                return;
            }

            showLoading('Aggiornamento stock...');
            try {
                await databases.updateDocument(
                    DATABASE_ID,
                    COLLECTION_IDS.INVENTORY,
                    inventoryDocId,
                    { stock: newStock }
                );

                // Aggiorna la cache e la UI in modo ottimistico
                inventoryCache[itemId].stock = newStock;
                renderInventoryList();
                
            } catch (error) {
                showModal('Errore', `Impossibile aggiornare lo stock. Errore: ${error.message}`);
            } finally {
                hideLoading();
            }
        }

        async function deleteItem(itemId) {
            const item = itemsCache.find(i => i.$id === itemId);
            const inventoryDocId = inventoryCache[itemId]?.docId;

            if (!confirm(`Sei sicuro di voler eliminare il prodotto "${item.name}"? Verranno rimossi anche i dati di inventario.`)) {
                return;
            }

            showLoading('Eliminazione prodotto...');
            try {
                // 1. Elimina il record di Inventory
                if (inventoryDocId) {
                    await databases.deleteDocument(
                        DATABASE_ID,
                        COLLECTION_IDS.INVENTORY,
                        inventoryDocId
                    );
                }

                // 2. Elimina l'Item
                await databases.deleteDocument(
                    DATABASE_ID,
                    COLLECTION_IDS.ITEMS,
                    itemId
                );

                showModal('Successo', `Prodotto "${item.name}" eliminato.`);
                loadInventoryData();
            } catch (error) {
                showModal('Errore', `Impossibile eliminare il prodotto. Errore: ${error.message}`);
            } finally {
                hideLoading();
            }
        }


        // =========================================================================
        // RENDERING DELLE VISTE (VIEW RENDERING)
        // =========================================================================

        function renderRecoveryView() {
            const container = document.getElementById('view-container');
            container.innerHTML = `
                <div class="max-w-md mx-auto my-12 p-8 bg-white rounded-xl card space-y-8">
                    <h2 class="text-3xl font-extrabold text-gray-900 text-center">Recupero Password</h2>
                    <p class="text-center text-gray-600">Inserisci l'indirizzo email associato al tuo account. Riceverai un link per reimpostare la password.</p>

                    <div class="space-y-4">
                        <input type="email" id="recovery-email" placeholder="Email" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        <button onclick="requestPasswordRecovery()" class="w-full btn-primary bg-yellow-500 text-white p-3 rounded-lg font-bold hover:bg-yellow-600 flex items-center justify-center">
                            <i data-lucide="mail-search" class="h-5 w-5 mr-2"></i>
                            Invia Link di Recupero
                        </button>
                        <button onclick="renderLoginView()" class="w-full text-sm text-gray-500 hover:text-indigo-600 mt-2">Torna al Login</button>
                    </div>
                </div>
            `;
            window.requestAnimationFrame(() => createIcons());
        }

        function renderLoginView() {
            const container = document.getElementById('view-container');
            container.innerHTML = `
                <div class="max-w-md mx-auto my-12 p-8 bg-white rounded-xl card space-y-8">
                    <h2 class="text-3xl font-extrabold text-gray-900 text-center">Accedi o Registrati</h2>

                    <!-- Sezione Login -->
                    <div class="space-y-4">
                        <h3 class="text-xl font-semibold text-gray-800 border-b pb-2">Login</h3>
                        <input type="email" id="login-email" placeholder="Email" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" value="demo@magazzino.it">
                        <input type="password" id="login-password" placeholder="Password" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" value="password123">
                        <button onclick="login()" class="w-full btn-primary bg-indigo-600 text-white p-3 rounded-lg font-bold hover:bg-indigo-700 flex items-center justify-center">
                            <i data-lucide="log-in" class="h-5 w-5 mr-2"></i>
                            Accedi
                        </button>
                        <button onclick="renderRecoveryView()" class="w-full text-sm text-indigo-600 hover:text-indigo-800 font-medium">Password dimenticata?</button>
                    </div>

                    <!-- Sezione Registrazione -->
                    <div class="space-y-4 pt-4 border-t border-gray-200">
                        <h3 class="text-xl font-semibold text-gray-800 border-b pb-2">Registrati</h3>
                        <input type="text" id="register-name" placeholder="Nome Visibile" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        <input type="email" id="register-email" placeholder="Email" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        <input type="password" id="register-password" placeholder="Password" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        <button onclick="register()" class="w-full btn-primary bg-green-500 text-white p-3 rounded-lg font-bold hover:bg-green-600 flex items-center justify-center">
                             <i data-lucide="user-plus" class="h-5 w-5 mr-2"></i>
                            Registrati (Prima Volta)
                        </button>
                    </div>
                </div>
            `;
             window.requestAnimationFrame(() => createIcons());
        }

        function renderTenantManagementView() {
            const container = document.getElementById('view-container');
            const tenantListHtml = tenantsCache.length > 0
                ? tenantsCache.map(t => `
                    <li class="flex justify-between items-center p-4 bg-gray-50 rounded-lg">
                        <span class="font-semibold text-gray-800">${t.name}</span>
                        <button onclick="switchTenant('${t.$id}')" class="px-3 py-1 bg-indigo-500 text-white text-sm rounded-lg hover:bg-indigo-600">Seleziona</button>
                    </li>
                `).join('')
                : `<p class="text-gray-500 text-center">Nessun magazzino trovato. Creane uno per iniziare.</p>`;

            container.innerHTML = `
                <div class="max-w-2xl mx-auto my-8 p-8 bg-white rounded-xl card space-y-6">
                    <h2 class="text-3xl font-bold text-gray-900 text-center">Gestione Magazzini</h2>
                    <p class="text-center text-gray-600">Devi selezionare o creare un magazzino per accedere all'inventario.</p>

                    <div class="space-y-4">
                        <button onclick="createTenant()" class="w-full btn-primary bg-green-600 text-white p-3 rounded-lg font-bold hover:bg-green-700 flex items-center justify-center">
                            <i data-lucide="factory" class="h-5 w-5 mr-2"></i>
                            Crea Nuovo Magazzino
                        </button>
                    </div>

                    <div class="space-y-4 pt-4 border-t border-gray-200">
                        <h3 class="text-xl font-semibold text-gray-800">Magazzini Esistenti</h3>
                        <ul class="space-y-3">
                            ${tenantListHtml}
                        </ul>
                    </div>
                </div>
            `;
            window.requestAnimationFrame(() => createIcons());
        }

        function renderDashboard() {
            const container = document.getElementById('view-container');
            container.innerHTML = `
                <div class="space-y-8">
                    <div class="flex flex-col md:flex-row md:justify-between md:items-center bg-indigo-50 p-4 rounded-xl card">
                        <h2 class="text-2xl font-bold text-indigo-700">Inventario di: ${currentTenantName}</h2>
                        <button onclick="renderTenantManagementView()" class="mt-2 md:mt-0 px-4 py-2 bg-indigo-500 text-white font-semibold rounded-lg hover:bg-indigo-600 text-sm flex items-center justify-center">
                             <i data-lucide="switch-camera" class="h-4 w-4 mr-1"></i>
                            Cambia Magazzino
                        </button>
                    </div>

                    <!-- Griglia Dashboard: Aggiunta Prodotto e Lista -->
                    <div class="dashboard-grid grid gap-8">
                        
                        <!-- Colonna Aggiungi Prodotto -->
                        <div class="bg-white p-6 rounded-xl card h-fit">
                            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                                <i data-lucide="package-plus" class="h-5 w-5 mr-2 text-green-600"></i>
                                Aggiungi Nuovo Prodotto
                            </h3>
                            <div class="space-y-3">
                                <input type="text" id="new-item-name" placeholder="Nome Prodotto (es. Bullone M8)" class="w-full p-2 border border-gray-300 rounded-lg">
                                <input type="text" id="new-item-sku" placeholder="Codice SKU (es. BM8)" class="w-full p-2 border border-gray-300 rounded-lg">
                                <input type="text" id="new-item-description" placeholder="Descrizione (Opzionale)" class="w-full p-2 border border-gray-300 rounded-lg">
                                <input type="number" id="new-item-stock" placeholder="Stock Iniziale (0)" value="0" min="0" class="w-full p-2 border border-gray-300 rounded-lg">
                                <button onclick="createItem()" class="w-full btn-primary bg-green-600 text-white p-3 rounded-lg font-bold hover:bg-green-700 flex items-center justify-center">
                                    <i data-lucide="save" class="h-5 w-5 mr-2"></i>
                                    Salva Prodotto
                                </button>
                            </div>
                        </div>

                        <!-- Colonna Lista Inventario -->
                        <div class="md:col-span-2 bg-white p-6 rounded-xl card">
                            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                                <i data-lucide="list-checks" class="h-5 w-5 mr-2 text-indigo-600"></i>
                                Stock Corrente
                            </h3>
                            <div id="inventory-list" class="space-y-4">
                                <!-- La lista verrà iniettata qui -->
                            </div>
                        </div>
                    </div>
                </div>
            `;
            window.requestAnimationFrame(() => createIcons());
            loadInventoryData();
        }
        
        function renderInventoryList() {
            const listContainer = document.getElementById('inventory-list');
            
            if (itemsCache.length === 0) {
                listContainer.innerHTML = `<p class="text-gray-500 text-center py-4">Nessun prodotto nel catalogo. Aggiungine uno a sinistra.</p>`;
                return;
            }

            const inventoryHtml = itemsCache.map(item => {
                const stockData = inventoryCache[item.$id];
                const stock = stockData ? stockData.stock : 0;
                const lowStockClass = stock <= 5 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700';

                return `
                    <div class="flex flex-col md:flex-row items-start md:items-center justify-between p-4 rounded-lg border border-gray-200 hover:bg-gray-50 transition-all">
                        
                        <!-- Dettagli Prodotto -->
                        <div class="mb-2 md:mb-0 md:w-1/2">
                            <div class="font-semibold text-gray-900">${item.name} <span class="text-xs text-gray-500 ml-2">(${item.sku})</span></div>
                            <p class="text-xs text-gray-600">${item.description || 'Nessuna descrizione'}</p>
                        </div>
                        
                        <!-- Stock e Controlli -->
                        <div class="flex items-center space-x-3 w-full md:w-auto">
                            <!-- Display Stock -->
                            <div class="flex items-center px-3 py-1 rounded-full font-bold ${lowStockClass} min-w-[70px] justify-center text-sm">
                                ${stock}
                            </div>
                            
                            <!-- Bottoni di Modifica Stock -->
                            <div class="flex space-x-2">
                                <button onclick="updateStock('${item.$id}', 1)" class="p-2 bg-indigo-100 text-indigo-600 rounded-full hover:bg-indigo-200" title="Aggiungi 1">
                                    <i data-lucide="plus" class="h-4 w-4"></i>
                                </button>
                                <button onclick="updateStock('${item.$id}', -1)" class="p-2 bg-red-100 text-red-600 rounded-full hover:bg-red-200" title="Rimuovi 1">
                                    <i data-lucide="minus" class="h-4 w-4"></i>
                                </button>
                                <button onclick="deleteItem('${item.$id}')" class="p-2 bg-gray-200 text-gray-600 rounded-full hover:bg-red-300 hover:text-red-700" title="Elimina Prodotto">
                                    <i data-lucide="trash-2" class="h-4 w-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            listContainer.innerHTML = inventoryHtml;
            window.requestAnimationFrame(() => createIcons());
        }

        // =========================================================================
        // STARTUP
        // =========================================================================

        // Avvia la verifica dell'autenticazione al caricamento della pagina
        window.onload = function() {
            if (APPWRITE_PROJECT_ID.startsWith('YOUR_')) {
                document.getElementById('view-container').innerHTML = `
                    <div class="max-w-xl mx-auto my-12 p-8 bg-red-100 border-l-4 border-red-500 text-red-700 rounded-xl card">
                        <h2 class="text-2xl font-bold mb-4">Errore di Configurazione Appwrite</h2>
                        <p>Per favore, modifica il file index.html e sostituisci <code>YOUR_APPWRITE_ENDPOINT</code> e <code>YOUR_PROJECT_ID</code> con le credenziali reali del tuo progetto Appwrite.</p>
                    </div>
                `;
                return;
            }
            // Gestisce la seconda fase del reset se ci sono i parametri URL
            handlePasswordRecovery(); 
            // Continua con il normale controllo dell'autenticazione
            checkAuth();
        };

    </script>
</body>
</html>
