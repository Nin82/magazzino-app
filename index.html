<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Magazzino Backendless</title>

<!-- ================= PWA SETTINGS ================= -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Icone Lucide -->
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/lucide.min.js"></script>
<script>
    window.addEventListener('load', () => {
        createIcons();
    });
</script>
<!-- Librerie Aggiuntive -->
<!-- Backendless SDK (Importante!) -->
<script src="https://unpkg.com/backendless/dist/backendless.min.js"></script>
<!-- Libreria QR Code -->
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.9/html5-qrcode.min.js"></script>
<!-- Libreria Chart.js per i grafici -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<style>
/* ================= STILE ================= */
body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; margin: 0; padding: 24px; background: #f8fafc; color: #1f2937; }
.hidden { display: none; }
.card { box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.05); }
.tab-active { border-bottom: 3px solid #4f46e5; color: #4f46e5; font-weight: 600; }
.input-focus:focus { border-color: #4f46e5; box-shadow: 0 0 0 1px #4f46e5; }
.btn-primary { transition: all 0.2s; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2); }

/* Stile per la notifica */
#notification-box {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    width: 300px;
}
.notification {
    margin-bottom: 10px;
    padding: 12px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    transition: opacity 0.5s ease-in-out;
}
.success { background-color: #ecfdf5; border: 1px solid #10b981; color: #065f46; }
.error { background-color: #fef2f2; border: 1px solid #ef4444; color: #991b1b; }
.info { background-color: #eff6ff; border: 1px solid #3b82f6; color: #1e40af; }

/* Stile per l'area QR (webcam) */
#qr-reader {
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    border: 2px solid #ccc;
    border-radius: 8px;
    overflow: hidden;
}

/* Stile per i modal */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}
.modal-content {
    background-color: white;
    padding: 24px;
    border-radius: 12px;
    max-width: 450px;
    width: 90%;
    max-height: 90vh;
    overflow-y: auto;
}


<script>
/* =========== CONFIG BACKENDLESS ============ */
const APPLICATION_ID = 'AA895053-C960-45EC-BFBE-FCBAFD9D7D0B'; 
const JAVASCRIPT_API_KEY = '1F4341D8-CAB8-44F6-97D6-203322D8D245';
const MAGAZZINO_TABLE_NAME = 'Magazzino';

let currentUser = null;
let html5QrcodeScanner = null;
let lastScanned = '';
let isCaricoMode = true;
let currentAuthTab = 'login';
let chartInstance = null;
let magazzinoData = [];

/* ============ UTILITY ============ */
function showNotification(message, type = 'info', duration = 3000) {
    const container = document.getElementById('notification-box');
    if (!container) return;
    const notification = document.createElement('div');
    notification.className = `notification ${type}`;
    notification.innerHTML = `<strong>${type.toUpperCase()}:</strong> ${message}`;
    container.appendChild(notification);
    setTimeout(() => {
        notification.style.opacity = '0';
        notification.addEventListener('transitionend', () => notification.remove());
    }, duration);
}

function toggleLoading(show) {
    document.getElementById('loading-overlay')?.classList.toggle('hidden', !show);
}
function showView(viewId) {
    document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
    document.getElementById(viewId)?.classList.remove('hidden');
}
function showModal(modalId) { document.getElementById(modalId)?.classList.remove('hidden'); }
function closeModal(modalId) { document.getElementById(modalId)?.classList.add('hidden'); }

/* ============ BACKENDLESS INIT ============ */
function initBackendless() {
    try {
        Backendless.initApp(APPLICATION_ID, JAVASCRIPT_API_KEY);
        return true;
    } catch (e) {
        console.error('Errore inizializzazione Backendless:', e);
        showNotification('Errore inizializzazione Backendless', 'error');
        return false;
    }
}

/* ============ AUTH ============ */
function switchAuthTab(tab) {
    currentAuthTab = tab;
    document.getElementById('auth-tab-login').classList.toggle('tab-active', tab === 'login');
    document.getElementById('auth-tab-register').classList.toggle('tab-active', tab === 'register');
    document.getElementById('auth-content-login').classList.toggle('hidden', tab !== 'login');
    document.getElementById('auth-content-register').classList.toggle('hidden', tab !== 'register');
}

async function login() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value.trim();
    toggleLoading(true);
    try {
        currentUser = await Backendless.UserService.login(email, password, true);
        updateAuthUI(currentUser);
        showView('dashboard-view');
        initializeQrScanner();
        await loadDashboardData();
        showNotification('Login effettuato con successo.', 'success');
    } catch (e) {
        showNotification('Errore login: ' + (e.message || 'Credenziali errate'), 'error');
    } finally {
        toggleLoading(false);
    }
}

async function registerUser() {
    const email = document.getElementById('register-email').value.trim();
    const password = document.getElementById('register-password').value.trim();
    const confirm = document.getElementById('register-password-confirm').value.trim();
    if (!email || !password || !confirm) return showNotification('Compila tutti i campi', 'error');
    if (password !== confirm) return showNotification('Le password non coincidono', 'error');
    toggleLoading(true);
    try {
        const user = new Backendless.User();
        user.email = email;
        user.password = password;
        await Backendless.UserService.register(user);
        showNotification('Registrazione completata. Ora effettua il login.', 'success');
        switchAuthTab('login');
    } catch (e) {
        showNotification('Errore registrazione: ' + e.message, 'error');
    } finally {
        toggleLoading(false);
    }
}

async function recoverPassword() {
    const email = document.getElementById('login-email').value.trim();
    if (!email) return showNotification('Inserisci la tua email per recuperare la password', 'error');
    toggleLoading(true);
    try {
        await Backendless.UserService.restorePassword(email);
        showNotification('Email di recupero inviata! Controlla la tua posta.', 'success');
    } catch (e) {
        showNotification('Errore recupero password: ' + e.message, 'error');
    } finally {
        toggleLoading(false);
    }
}

async function logout() {
    toggleLoading(true);
    try {
        await Backendless.UserService.logout();
        currentUser = null;
        showView('login-view');
        showNotification('Logout effettuato', 'info');
    } catch (e) {
        showNotification('Errore logout', 'error');
    } finally {
        toggleLoading(false);
    }
}

function updateAuthUI(user) {
    const authStatus = document.getElementById('auth-status');
    if (user) {
        authStatus.classList.remove('hidden');
        document.getElementById('user-display').innerText = user.email;
    } else {
        authStatus.classList.add('hidden');
    }
}

/* ============ QR SCANNER ============ */
function initializeQrScanner() {
    if (html5QrcodeScanner) return;
    html5QrcodeScanner = new Html5Qrcode("qr-reader");
    html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 },
        qrCodeMessage => {
            lastScanned = qrCodeMessage;
            document.getElementById('qr-result').value = lastScanned;
            document.getElementById('carico-barcode').value = lastScanned;
            document.getElementById('scarico-barcode').value = lastScanned;
        },
        errorMessage => {}
    );
}

/* ============ MODALITÀ ============ */
function switchMode(mode) {
    isCaricoMode = (mode === 'carico');
    document.getElementById('tab-carico').classList.toggle('tab-active', isCaricoMode);
    document.getElementById('tab-scarico').classList.toggle('tab-active', !isCaricoMode);
    document.getElementById('form-carico').classList.toggle('hidden', !isCaricoMode);
    document.getElementById('form-scarico').classList.toggle('hidden', isCaricoMode);
}

/* ============ CARICO ============ */
async function doCarico() {
    const barcode = document.getElementById('carico-barcode').value.trim();
    const name = document.getElementById('carico-article').value.trim();
    const quantity = parseInt(document.getElementById('carico-qty').value, 10);
    if (!barcode || !name) return showNotification('Compila tutti i campi', 'error');
    toggleLoading(true);
    try {
        const existing = await Backendless.Data.of(MAGAZZINO_TABLE_NAME).find({ whereClause: `barcode='${barcode}'` });
        let item = existing[0];
        if (item) {
            item.quantity = (item.quantity || 0) + quantity;
        } else {
            item = { barcode, name, quantity };
        }
        await Backendless.Data.of(MAGAZZINO_TABLE_NAME).save(item);
        showNotification('Articolo caricato correttamente', 'success');
        await loadDashboardData();
    } catch (e) {
        showNotification('Errore carico: ' + e.message, 'error');
    } finally {
        toggleLoading(false);
    }
}

/* ============ SCARICO ============ */
async function doScarico() {
    const barcode = document.getElementById('scarico-barcode').value.trim();
    const quantity = parseInt(document.getElementById('scarico-qty').value, 10);
    if (!barcode || !quantity) return showNotification('Compila i campi', 'error');
    toggleLoading(true);
    try {
        const existing = await Backendless.Data.of(MAGAZZINO_TABLE_NAME).find({ whereClause: `barcode='${barcode}'` });
        if (!existing.length) return showNotification('Articolo non trovato', 'error');
        const item = existing[0];
        item.quantity = Math.max(0, item.quantity - quantity);
        await Backendless.Data.of(MAGAZZINO_TABLE_NAME).save(item);
        showNotification('Articolo scaricato', 'success');
        await loadDashboardData();
    } catch (e) {
        showNotification('Errore scarico: ' + e.message, 'error');
    } finally {
        toggleLoading(false);
    }
}

/* ============ DASHBOARD ============ */
async function loadDashboardData() {
    toggleLoading(true);
    try {
        const data = await Backendless.Data.of(MAGAZZINO_TABLE_NAME).find();
        magazzinoData = data;
        updateStats(data);
        renderList(data);
        renderChart(data);
        populateScaricoSelect(data);
    } catch (e) {
        showNotification('Errore caricamento dati', 'error');
    } finally {
        toggleLoading(false);
    }
}

function updateStats(data) {
    const totalItems = data.length;
    const totalQty = data.reduce((sum, i) => sum + (i.quantity || 0), 0);
    const lowStock = data.filter(i => (i.quantity || 0) <= 5).length;
    document.getElementById('stat-total-items').innerText = totalItems;
    document.getElementById('stat-total-qty').innerText = totalQty;
    document.getElementById('stat-low-stock').innerText = lowStock;
}

function renderList(data) {
    const container = document.getElementById('magazzino-list');
    container.innerHTML = '';
    data.forEach(i => {
        const div = document.createElement('div');
        div.className = 'p-2 border rounded flex justify-between items-center';
        div.innerHTML = `<div><strong>${i.name}</strong> (Barcode: ${i.barcode}) - Qty: ${i.quantity}</div>
        <button onclick="editItem('${i.objectId}')" class="p-1 bg-indigo-600 text-white rounded text-sm">Modifica</button>`;
        container.appendChild(div);
    });
}

function renderChart(data) {
    const ctx = document.getElementById('inventory-chart').getContext('2d');
    const labels = data.map(i => i.name);
    const values = data.map(i => i.quantity);
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets: [{ label: 'Quantità', data: values, backgroundColor: 'rgba(79,70,229,0.6)' }] },
        options: { responsive: true, plugins: { legend: { display: false } } }
    });
}

function populateScaricoSelect(data) {
    const select = document.getElementById('scarico-select');
    select.innerHTML = '';
    data.forEach(i => {
        const opt = document.createElement('option');
        opt.value = i.barcode;
        opt.text = `${i.name} - Qty: ${i.quantity}`;
        select.appendChild(opt);
    });
}

/* ============ MODALE EDIT ============ */
async function editItem(objectId) {
    const item = magazzinoData.find(i => i.objectId === objectId);
    if (!item) return;
    document.getElementById('edit-objectId').value = objectId;
    document.getElementById('edit-article').value = item.name;
    document.getElementById('edit-barcode').value = item.barcode;
    document.getElementById('edit-quantity').value = item.quantity;
    showModal('edit-modal');
}

async function saveEdit() {
    const objectId = document.getElementById('edit-objectId').value;
    const name = document.getElementById('edit-article').value;
    const barcode = document.getElementById('edit-barcode').value;
    const quantity = parseInt(document.getElementById('edit-quantity').value, 10) || 0;
    toggleLoading(true);
    try {
        await Backendless.Data.of(MAGAZZINO_TABLE_NAME).save({ objectId, name, barcode, quantity });
        showNotification('Articolo aggiornato', 'success');
        await loadDashboardData();
        closeModal('edit-modal');
    } catch (e) {
        showNotification('Errore aggiornamento', 'error');
    } finally {
        toggleLoading(false);
    }
}

async function deleteItem() {
    const objectId = document.getElementById('edit-objectId').value;
    toggleLoading(true);
    try {
        await Backendless.Data.of(MAGAZZINO_TABLE_NAME).remove({ objectId });
        showNotification('Articolo eliminato', 'success');
        await loadDashboardData();
        closeModal('edit-modal');
    } catch (e) {
        showNotification('Errore eliminazione', 'error');
    } finally {
        toggleLoading(false);
    }
}

/* ============ STARTUP ============ */
document.addEventListener('DOMContentLoaded', async () => {
    if (!initBackendless()) return;

    document.getElementById('carico-barcode').addEventListener('keypress', e => e.key === 'Enter' && doCarico());
    document.getElementById('scarico-barcode').addEventListener('keypress', e => e.key === 'Enter' && doScarico());
    document.getElementById('scarico-select').addEventListener('change', loadDashboardData);

    // Recupera password
    const forgotLink = document.getElementById('forgot-password-link');
    if (forgotLink) forgotLink.addEventListener('click', recoverPassword);

    try {
        const user = await Backendless.UserService.getCurrentUser();
        if (user) {
            currentUser = user;
            updateAuthUI(user);
            showView('dashboard-view');
            initializeQrScanner();
            await loadDashboardData();
        } else {
            showView('login-view');
        }
    } catch (e) {
        console.error(e);
        showView('login-view');
    }
});
</script>


            <!-- =================== DASHBOARD STATISTICHE =================== -->
            <div id="dashboard-stats-tab">
                <div class="bg-white p-6 rounded-xl card mb-8">
                    <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <i data-lucide="pie-chart" class="h-5 w-5 mr-2 text-indigo-600"></i>
                        Statistiche di Magazzino
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div class="bg-indigo-50 p-4 rounded-lg flex items-center justify-between">
                            <div>
                                <p class="text-sm text-indigo-700 font-medium">Articoli Unici</p>
                                <p id="stat-total-items" class="text-3xl font-bold text-indigo-800">0</p>
                            </div>
                            <i data-lucide="boxes" class="h-8 w-8 text-indigo-400"></i>
                        </div>
                        <div class="bg-green-50 p-4 rounded-lg flex items-center justify-between">
                            <div>
                                <p class="text-sm text-green-700 font-medium">Unità Totali in Stock</p>
                                <p id="stat-total-quantity" class="text-3xl font-bold text-green-800">0</p>
                            </div>
                            <i data-lucide="package" class="h-8 w-8 text-green-400"></i>
                        </div>
                        <div class="bg-yellow-50 p-4 rounded-lg flex items-center justify-between">
                            <div>
                                <p class="text-sm text-yellow-700 font-medium">Articoli Sotto Soglia (<=5)</p>
                                <p id="stat-low-stock" class="text-3xl font-bold text-yellow-800">0</p>
                            </div>
                            <i data-lucide="alert-triangle" class="h-8 w-8 text-yellow-400"></i>
                        </div>
                    </div>

                    <div id="chart-container" class="h-96">
                        <canvas id="inventory-chart"></canvas>
                    </div>
                </div>
            </div>

            <!-- =================== DASHBOARD MAIN =================== -->
            <div id="dashboard-main-tab">

                <!-- Scanner QR -->
                <div class="p-6 bg-white rounded-xl card mb-8">
                    <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <i data-lucide="qrcode" class="h-5 w-5 mr-2 text-indigo-600"></i>
                        Scanner QR/Barcode
                    </h3>
                    <div id="qr-reader" class="mb-4"></div>
                    <input type="text" id="qr-result" placeholder="Risultato Scansione" class="w-full p-2 border border-gray-300 rounded-lg text-sm bg-gray-100" readonly>
                </div>

                <!-- CARICO / SCARICO TAB -->
                <div class="flex border-b border-gray-200 mb-6">
                    <button id="tab-carico" onclick="switchMode('carico')" class="flex-1 px-4 py-2 text-gray-700 transition-colors duration-150 tab-active">
                        <i data-lucide="package-plus" class="h-5 w-5 inline-block mr-1"></i>
                        Carico (Entrata)
                    </button>
                    <button id="tab-scarico" onclick="switchMode('scarico')" class="flex-1 px-4 py-2 text-gray-700 transition-colors duration-150">
                        <i data-lucide="package-minus" class="h-5 w-5 inline-block mr-1"></i>
                        Scarico (Uscita)
                    </button>
                </div>

                <!-- Modulo Carico -->
                <div id="form-carico" class="bg-white p-6 rounded-xl card space-y-4">
                    <!-- il contenuto rimane invariato -->
                </div>

                <!-- Modulo Scarico -->
                <div id="form-scarico" class="bg-white p-6 rounded-xl card space-y-4 hidden">
                    <!-- il contenuto rimane invariato -->
                </div>

                <!-- Lista Inventario -->
                <div class="mt-8 bg-white p-6 rounded-xl card">
                    <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <i data-lucide="list-checks" class="h-5 w-5 mr-2 text-indigo-600"></i>
                        Stock Corrente in Magazzino
                    </h3>
                    <div id="magazzino-list" class="space-y-3">
                        <!-- Lista articoli caricata da loadDashboardData -->
                    </div>
                    <button onclick="loadDashboardData()" class="mt-4 w-full p-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200">
                        <i data-lucide="refresh-cw" class="h-4 w-4 inline-block mr-1"></i>
                        Aggiorna Lista
                    </button>
                </div>

            </div>
            <!-- /dashboard-main-tab -->

        </div>
    </div>
    <!-- /dashboard-view -->

</main>

<!-- Loader Overlay -->
<div id="loading-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white p-6 rounded-lg flex items-center">
        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Caricamento...</span>
    </div>
</div>

<!-- Notification Box -->
<div id="notification-box"></div>

</body>
</html>
