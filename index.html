<style>
/* ================= STILE ================= */
/* 🚨 NUOVO: Abilita lo scorrimento animato su anchor e scrollIntoView() */
html {
    scroll-behavior: smooth;
}

body { 
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; 
    margin: 0; 
    padding: 0; 
    background: #f8fafc; 
    color: #1f2937; 
}

/* 💡 MIGLIORAMENTO: Blocca lo scorrimento della pagina quando il modale è aperto (richiede JS) */
.modal-open {
    overflow: hidden;
}

.hidden { display: none; }
.card { box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.05); }
.tab-active { border-bottom: 3px solid #4f46e5; color: #4f46e5; font-weight: 600; }
.input-focus:focus { border-color: #4f46e5; box-shadow: 0 0 0 1px #4f46e5; }
.btn-primary { transition: all 0.2s; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2); }

/* Stile per la notifica */
#notification-box {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    width: 300px;
}
.notification {
    margin-bottom: 10px;
    padding: 12px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    transition: opacity 0.5s ease-in-out;
}
.success { background-color: #ecfdf5; border: 1px solid #10b981; color: #065f46; }
.error { background-color: #fef2f2; border: 1px solid #ef4444; color: #991b1b; }
.info { background-color: #eff6ff; border: 1px solid #3b82f6; color: #1e40af; }

/* Stile per l'area QR (webcam) */
#qr-reader {
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    border: 2px solid #ccc;
    border-radius: 8px;
    overflow: hidden;
}

/* Stile per i modal */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
}
.modal-content {
    background-color: white;
    padding: 24px;
    border-radius: 12px;
    max-width: 450px;
    width: 90%;
    max-height: 90vh;
    overflow-y: auto;
}
</style>
