<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reimposta Password</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    .hidden { display: none; } /* Aggiungi classe hidden per gestire la visibilità */
    body { font-family: sans-serif; background: #f4f4f4; text-align: center; padding: 40px; }
    form { background: white; max-width: 400px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input, button { display: block; width: 100%; margin-top: 10px; padding: 10px; }
  </style>
</head>
<body>
  <h2>🔒 Reimposta la tua Password</h2>
  <form id="new-pass-form" class="hidden">
    <input type="password" id="new-password" placeholder="Nuova password (min 6 caratteri)" required />
    <button type="submit">Aggiorna Password</button>
  </form>
  <p id="msg">Verifica del link in corso...</p>

  <script>

    // La tua chiave anon è necessaria qui
    const supabase = window.supabase.createClient('https://eevwzkcesmfofpecuxwv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVldnd6a2Nlc21mb2ZwZWN1eHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2ODkxOTAsImV4cCI6MjA3NjI2NTE5MH0.j7TQnwbw-gW2S6QBjyp4wsQJrXUVYmg3wwVWVPRe1b4');
    
    const msgElement = document.getElementById('msg');
    const formElement = document.getElementById('new-pass-form');

    // ----------------------------------------------------
    // 1. Listener per la pulizia e lo stato (Non critico)
    // ----------------------------------------------------
    supabase.auth.onAuthStateChange((event) => {
        // Pulisce l'URL solo se c'è un hash (token)
        if (window.location.hash) {
            window.history.replaceState({}, document.title, window.location.pathname);
        }
        
        // Nel caso in cui il token sia scaduto dopo il caricamento
        if (event === 'SIGNED_OUT') {
            msgElement.textContent = 'Sessione di reset scaduta. Richiedi un nuovo link.';
            formElement.classList.add('hidden');
        }
    });

    // ----------------------------------------------------
    // 2. Controllo Immediato e Logica di Visualizzazione (CRUCIALE)
    // ----------------------------------------------------
    (async () => {
        // Prova a recuperare la sessione immediatamente.
        // Se il token è nell'URL, getSession() lo consumerà e creerà una sessione temporanea.
        const { data: { session } } = await supabase.auth.getSession();

        if (session) {
            // ✅ SUCCESS: Il token è stato letto e la sessione temporanea è attiva.
            msgElement.textContent = 'Perfetto! Inserisci la tua nuova password.';
            formElement.classList.remove('hidden');

        } else if (window.location.hash) {
             // Questo caso si verifica raramente ma indica un problema di token scaduto
             msgElement.textContent = 'Errore: Il link è scaduto o non valido. Richiedi un nuovo reset.';
             formElement.classList.add('hidden');
        } else {
            // Nessuna sessione e nessun hash (l'utente ha aperto la pagina direttamente)
            msgElement.textContent = 'Per resettare la password, usa il link che ti abbiamo inviato via email.';
            formElement.classList.add('hidden');
        }
    })();


    // ----------------------------------------------------
    // 3. Logica di Aggiornamento Password
    // ----------------------------------------------------
    formElement.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      
      if (newPassword.length < 6) {
          msgElement.textContent = 'La password deve avere almeno 6 caratteri.';
          return;
      }

      // Questa chiamata usa la sessione temporanea che abbiamo stabilito nel punto 2.
      const { error } = await supabase.auth.updateUser({ password: newPassword });
      
      if (error) {
        document.getElementById('msg').textContent = 'Errore di aggiornamento: ' + error.message;
      } else {
        document.getElementById('msg').textContent = '✅ Password aggiornata con successo! Sarai reindirizzato al login.';
        formElement.classList.add('hidden');
         // Reindirizza al login principale dopo 3 secondi
         setTimeout(() => {
             // Assicurati che l'URL sia corretto
             window.location.href = 'https://nin82.github.io/magazzino-app/'; 
         }, 3000);
      }
    });
  
  </script>
</body>
</html>
