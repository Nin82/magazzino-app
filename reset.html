<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reimposta Password</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f4f4;
      text-align: center;
      padding: 40px 20px;
      color: #1f2937;
    }
    .container {
      background: white;
      max-width: 400px;
      margin: 50px auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    h2 {
      color: #4f46e5;
      margin-bottom: 20px;
    }
    input {
      display: block;
      width: calc(100% - 20px);
      margin: 15px auto;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #4338ca; }
    #msg { margin-top: 20px; font-weight: 600; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔒 Reimposta la tua Password</h2>
    
    <form id="new-pass-form" class="hidden">
      <input type="password" id="new-password" placeholder="Nuova password (min 6 caratteri)" required />
      <button type="submit">Aggiorna Password</button>
    </form>
    
    <p id="msg">Verifica del link in corso...</p>
  </div>

  <script>
    // === CONFIGURAZIONE SUPABASE ===
    const SUPABASE_URL = 'https://eevwzkcesmfofpecuxwv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVldnd6a2Nlc21mb2ZwZWN1eHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2ODkxOTAsImV4cCI6MjA3NjI2NTE5MH0.j7TQnwbw-gW2S6QBjyp4wsQJrXUVYmg3wwVWVPRe1b4';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const REDIRECT_HOME = 'https://nin82.github.io/magazzino-app/';

    const msgEl = document.getElementById('msg');
    const formEl = document.getElementById('new-pass-form');
    const newPassEl = document.getElementById('new-password');

    // === 1️⃣ LETTURA TOKEN & LOGIN TEMPORANEO ===
    async function init() {
      msgEl.textContent = 'Verifica del link in corso...';

      // 1. Legge i parametri dall’URL (token e type)
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const type = params.get('type');

      if (!token || type !== 'recovery') {
        msgEl.textContent = '❌ Link non valido o scaduto. Richiedi un nuovo reset.';
        return;
      }

      // 2. Verifica e crea una sessione temporanea
      const { data, error } = await supabase.auth.verifyOtp({
        token,
        type: 'recovery',
      });

      if (error || !data?.session) {
        console.error(error);
        msgEl.textContent = '❌ Link non valido o già utilizzato. Richiedi un nuovo link.';
        return;
      }

      // 3. Se ok, mostra il form
      msgEl.textContent = '✅ Link verificato! Inserisci la tua nuova password.';
      formEl.classList.remove('hidden');
      newPassEl.focus();
    }

    // === 2️⃣ AGGIORNAMENTO PASSWORD ===
    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = newPassEl.value.trim();

      if (newPassword.length < 6) {
        msgEl.textContent = 'La password deve avere almeno 6 caratteri.';
        return;
      }

      msgEl.textContent = '⏳ Aggiornamento in corso...';

      const { error } = await supabase.auth.updateUser({ password: newPassword });

      if (error) {
        msgEl.textContent = '❌ Errore: ' + error.message;
      } else {
        msgEl.textContent = '✅ Password aggiornata! Reindirizzamento in corso...';
        formEl.classList.add('hidden');
        setTimeout(() => window.location.href = REDIRECT_HOME, 3000);
      }
    });

    // === AVVIO ===
    init();
  </script>
</body>
</html>
